<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registry de Inventario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Registry de Inventario</h1>

    <!-- Campo principal -->
    <div class="registro">
      <input type="text" id="producto" placeholder="Buscar o escribir producto">
      <div class="sub-registro">
        <input type="number" step="0.01" id="unidades" placeholder="Unidades">
        <input type="number" step="1" id="cajas" placeholder="Cajas">
        <input type="number" id="total_unidades" placeholder="Total unidades" readonly>
        <button id="registrar">Registrar</button>
      </div>
    </div>

    <!-- Botones de acción encima de la tabla -->
    <input type="text" id="buscador" placeholder="Buscar registro..." style="width:100%;padding:8px;margin-bottom:10px;">
    <div class="acciones">
      <button id="exportar">Exportar a CSV</button>
      <button id="eliminarTodo">Eliminar todo</button>
    </div>

    <!-- Tabla de registros -->
    <table id="tabla">
      <thead>
        <tr>
          <th id="ordenProducto">Producto</th>
          <th>Unidades</th>
          <th>Cajas</th>
          <th>Total Unidades</th>
          <th>Hora</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- registros -->
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
